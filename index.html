<script>
<script>
let shieldBreakActive=false;
let resonanceActive=true;
let useBATK=false;
let bucket10Open=false;

function toggleShield(){shieldBreakActive=!shieldBreakActive;calc()}
function toggleResonance(){resonanceActive=!resonanceActive;calc()}
function toggleAtkType(){useBATK=!useBATK;calc()}

function v(id){return parseFloat(document.getElementById(id)?.value)||0}

function fmt(n){
if(Math.abs(n)>=1e9)return(n/1e9).toFixed(2)+'B';
if(Math.abs(n)>=1e6)return(n/1e6).toFixed(2)+'M';
if(Math.abs(n)>=1e3)return(n/1e3).toFixed(1)+'K';
return Math.round(n)
}

function calcATKparts(patk,str,patkpct,pdef,pen,shred){
const totalPATK=patk*(1+str/1000)*(1+patkpct/100);
const effectiveDef=pdef*(1-pen/100);
const dr=3500/(3500+effectiveDef);
const actualATK=totalPATK*dr+shred;
return{totalPATK,dr,actualATK};
}

function calc(){

// ===== GLACEIETE YOYO PRESET =====
const INT=8854;
const PATK=16808;
const PEN=36;
const SKILLDMG=36;
const BOSS=27;
const DEBUFF=26;
const DMG_BUFF=101;
const RES_ENEMY=60;

// Bucket 1
const base1=calcATKparts(PATK,INT,0,RES_ENEMY,PEN,0);

// Bucket 2
const b2=1; // Skill Page assumida 100%

// Bucket 3
const b3=1+2.282; // 228.2% crit dmg

// Bucket 4
const b4=1; // sem vantagem elemental aplicada

// Bucket 5
const b5=1;

// Bucket 6
const b6=1+DMG_BUFF/100;

// Bucket 7
const b7=1;

// Bucket 8
const resonanceBonus=resonanceActive?0.285:0;
const b8=1+SKILLDMG/100+resonanceBonus;

// Bucket 9
const b9=1+BOSS/100+DEBUFF/100;

// Bucket 10
const b10=1;

// Bucket 11
const b11=1+0.036;

const finalDamage=
base1.actualATK*
b2*
b3*
b4*
b5*
b6*
b7*
b8*
b9*
b10*
b11;

document.getElementById('baseDmg').textContent=fmt(finalDamage);
document.getElementById('modDmg').textContent=fmt(finalDamage);
document.getElementById('changePct').textContent="YOYO BUILD";
}

calc();
</script>
</script>
</body>
</html>
